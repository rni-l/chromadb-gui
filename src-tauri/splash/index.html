<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chroma GUI</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; } }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      main { text-align: center; max-width: 560px; padding: 0 24px; }
      .logo { width: 56px; height: 56px; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
      p { color: var(--muted); margin: 12px 0 0; }
      pre {
        text-align: left; white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--muted);
        max-height: 240px; overflow: auto; -webkit-user-select: text; user-select: text;
      }
      .error .logo { animation: none; opacity: .4; }
      .error h1 { color: #dc2626; }
      h1 { font-size: 16px; font-weight: 600; margin: 16px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="12" cy="16" r="9" fill="#f59e0b" opacity=".9" />
        <circle cx="20" cy="16" r="9" fill="#ea580c" opacity=".85" />
        <circle cx="16" cy="16" r="4" fill="#fff" opacity=".9" />
      </svg>
      <h1 id="title">正在启动…</h1>
      <p id="detail"></p>
      <pre id="log"></pre>
    </main>
    <script>
      // Called from the Rust side when the server fails to come up.
      window.showError = (title, detail, log) => {
        document.body.classList.add("error");
        document.getElementById("title").textContent = title;
        document.getElementById("detail").textContent = detail;
        document.getElementById("log").textContent = log;
      };
    </script>
  </body>
</html>
